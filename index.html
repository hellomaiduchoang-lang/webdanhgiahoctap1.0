/* Clearer hierarchy, stronger contrast, and a brighter ClassTrack accent palette. */
:root{--ink:#14213d;--muted:#56647c;--line:#dce3f0;--paper:#f2f5fc;--brand:#405de6;--secondary:#7655d8;--accent:#13a89a;--success:#087c59;--warning:#9b5c00;--red:#bd3348;--shadow:0 10px 30px rgba(33,52,104,.08);--shadow-hover:0 14px 35px rgba(42,61,132,.14)}
:root[data-theme=dark]{--ink:#f2f5ff;--muted:#c0cae0;--line:#35425c;--paper:#111827;--white:#1a2436;--brand:#9aaaff;--secondary:#b49dff;--accent:#5ce0cd;--success:#67d8ae;--warning:#ffd071;--red:#ff99a3;--shadow:0 10px 30px rgba(0,0,0,.28);--shadow-hover:0 14px 35px rgba(0,0,0,.38)}
body{font-size:15.5px;line-height:1.6;letter-spacing:0}
h1,h2,h3,b,strong,.metric-value{color:var(--ink)}
.muted,.hint,.breadcrumb{color:var(--muted)}
.hint{font-size:13.5px}
.card h1{font-size:27px;line-height:1.25}
.card h2{font-size:20px;line-height:1.35}
.card{border-color:var(--line)}
.pill{background:color-mix(in srgb,var(--brand) 10%,var(--white));color:var(--brand);font-weight:700}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--secondary));border-color:transparent;color:#fff}
.btn.lime{background:linear-gradient(135deg,#12a98e,#48c9b4);border-color:transparent;color:#fff}
.btn.danger{border-color:color-mix(in srgb,var(--red) 30%,var(--line));color:var(--red)}
.nav.active{box-shadow:inset 3px 0 0 var(--brand)}
.hero-card,.hero{background:linear-gradient(125deg,color-mix(in srgb,var(--brand) 12%,var(--white)),color-mix(in srgb,var(--accent) 8%,var(--white)) 75%);border:1px solid color-mix(in srgb,var(--brand) 18%,var(--line));border-radius:18px;padding:22px}
.announcement{border-left:4px solid var(--warning);background:linear-gradient(120deg,color-mix(in srgb,var(--warning) 9%,var(--white)),var(--white) 70%)}
.feed-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:18px 0 4px;padding-bottom:10px}
.feed-tab{border:0;background:transparent;color:var(--muted);font-weight:750;border-radius:10px;padding:9px 14px}
.feed-tab.active{background:color-mix(in srgb,var(--brand) 11%,var(--white));color:var(--brand)}
.cancel-btn{background:var(--white);color:var(--muted)}
/* Keep message text clearly separated from the composer and the card surface. */
.composer{background:#e8edff;color:#1d2a4c;border:1px solid #b5c2ef;font-weight:700}
.composer:hover{background:#dce5ff;border-color:#8298eb;color:#111d3c}
.comment{background:#eaf6f3;color:#14213d;border:1px solid #c9e5de;font-size:14px;line-height:1.65}
.comment b,.postbody{color:var(--ink)}
.postbody{font-size:16px;font-weight:520;line-height:1.75}
.commentform input,textarea{color:var(--ink);background:var(--white)}
input::placeholder,textarea::placeholder,.composer::placeholder{color:#53617a;opacity:1}

:root[data-theme=dark] .composer:hover{background:#344363;color:#fff}
:root[data-theme=dark] .comment{background:#203b39;color:#effffb;border-color:#37635c}
:root[data-theme=dark] .comment b,:root[data-theme=dark] .postbody{color:#f2f5ff}
:root[data-theme=dark] input::placeholder,:root[data-theme=dark] textarea::placeholder{color:#c0cbe0}
.student-modalbox:has(.student-add-modal){width:min(820px,100%);padding:26px}
.student-add-modal{display:grid;gap:14px}
.student-add-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}

.student-preview{margin-top:10px;max-height:260px}

.table-wrap{max-width:100%;overflow-x:auto}.check{display:flex;align-items:center;gap:8px;padding:6px}.notice{background:#fff8db;border:1px solid #e9d990;border-radius:12px;padding:12px}.success{color:#176b48}

<script>
const app=document.querySelector('#app');let me=null,csrf='',years=[],classes=[],selectedYear='',selectedClass='',visibleRoster=[],forumTab='ALL',page='home',groupWeekSelection='',groupPointSubmissions=new Set(),sidebarCollapsed=localStorage.getItem('classtrack_sidebar_collapsed')==='1';
const themePreference=localStorage.getItem('classtrack_theme')||'system';const applyTheme=preference=>{document.documentElement.dataset.theme=preference==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):preference};applyTheme(themePreference);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',event=>{if((localStorage.getItem('classtrack_theme')||'system')==='system')applyTheme('system')});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function currentIsoWeek(){const d=new Date(),u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));u.setUTCDate(u.getUTCDate()+4-(u.getUTCDay()||7));const y=u.getUTCFullYear(),a=new Date(Date.UTC(y,0,1)),w=Math.ceil((((u-a)/86400000)+1)/7);return `${y}-W${String(w).padStart(2,'0')}`}
async function submitGroupRule(studentId,ruleId){if(!studentId||!ruleId||groupPointSubmissions.has(studentId))return;groupPointSubmissions.add(studentId);try{await api('/group/conduct-records','POST',{classId:selectedClass,studentProfileId:studentId,ruleId,reason:''});toast('Đã gửi ghi nhận, chờ giáo viên xác minh.');await render()}catch(e){toast(e.message||'Không thể gửi ghi nhận.')}finally{groupPointSubmissions.delete(studentId)}}
document.addEventListener('click',async event=>{const button=event.target instanceof Element?event.target.closest('#publishGroupConduct'):null;if(!button)return;button.disabled=true;try{const week=document.querySelector('#groupWeek')?.value||currentIsoWeek(),result=await api('/group/conduct/publish','POST',{classId:selectedClass,week});toast(`Đã đăng điểm đã xác minh của ${result.unitType==='NHOM'?'nhóm':'tổ'} lên diễn đàn lớp.`);await render()}catch(e){toast(e.message||'Không thể đăng kết quả tổ/nhóm.')}finally{if(button.isConnected)button.disabled=false}});
document.addEventListener('click',async event=>{const button=event.target instanceof Element?event.target.closest('#saveClassUnitType'):null;if(!button)return;button.disabled=true;try{const result=await api(`/classes/${encodeURIComponent(selectedClass)}/unit-type`,'POST',{unitType:document.querySelector('#classUnitType').value});const cls=classes.find(item=>item.id===selectedClass);if(cls)cls.unitType=result.unitType;toast(`Đơn vị quản lý của lớp đã chuyển sang ${result.unitType==='NHOM'?'nhóm':'tổ'}.`);await render()}catch(e){toast(e.message||'Không thể đổi loại đơn vị.')}finally{if(button.isConnected)button.disabled=false}});
let groupPointDrag=null;
function groupRuleFromEvent(event){return event.target instanceof Element?event.target.closest('[data-point-rule]'):null}
function groupStudentFromPoint(x,y){const target=document.elementFromPoint(x,y);return target instanceof Element?target.closest('[data-drop-target]'):null}
function clearGroupDropTarget(){document.querySelectorAll('.group-score-table tr.drop-active').forEach(row=>row.classList.remove('drop-active'))}
function refreshGroupPointDropTarget(){if(!groupPointDrag?.active)return;const drag=groupPointDrag;drag.ghost.style.transform=`translate(${drag.x+12}px,${drag.y+12}px)`;clearGroupDropTarget();const row=groupStudentFromPoint(drag.x,drag.y);if(row)row.classList.add('drop-active');const edge=76;if(drag.y>innerHeight-edge)window.scrollBy(0,Math.max(5,(drag.y-(innerHeight-edge))*.16));else if(drag.y<edge)window.scrollBy(0,-Math.max(5,((edge-drag.y)*.16)))}
function updateGroupPointDrag(event){if(!groupPointDrag||event.pointerId!==groupPointDrag.pointerId)return;const drag=groupPointDrag,dx=event.clientX-drag.startX,dy=event.clientY-drag.startY;if(!drag.active&&Math.hypot(dx,dy)<8)return;drag.active=true;drag.x=event.clientX;drag.y=event.clientY;event.preventDefault();if(!drag.ghost){drag.ghost=document.createElement('div');drag.ghost.className='group-point-drag-ghost';drag.ghost.textContent=drag.label;document.body.append(drag.ghost)}refreshGroupPointDropTarget();if(!drag.frame)drag.frame=requestAnimationFrame(function tick(){if(!groupPointDrag?.active)return;refreshGroupPointDropTarget();groupPointDrag.frame=requestAnimationFrame(tick)})}
function finishGroupPointDrag(event){if(!groupPointDrag||event.pointerId!==groupPointDrag.pointerId)return;const drag=groupPointDrag,row=drag.active?groupStudentFromPoint(event.clientX,event.clientY):null;groupPointDrag=null;if(drag.frame)cancelAnimationFrame(drag.frame);drag.ghost?.remove();clearGroupDropTarget();if(drag.active){event.preventDefault();if(row)submitGroupRule(row.dataset.dropTarget,drag.ruleId);else toast('Kéo mức điểm vào hàng của học sinh cần chấm.');}}
document.addEventListener('pointerdown',event=>{const chip=groupRuleFromEvent(event);if(!chip||event.pointerType==='mouse'||event.button!==0||!chip.draggable)return;groupPointDrag={pointerId:event.pointerId,ruleId:chip.dataset.pointRule,label:chip.textContent.trim(),startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,active:false,ghost:null,frame:0}});
document.addEventListener('pointermove',updateGroupPointDrag,{passive:false});
document.addEventListener('pointerup',finishGroupPointDrag);
document.addEventListener('pointercancel',event=>{if(!groupPointDrag||event.pointerId!==groupPointDrag.pointerId)return;if(groupPointDrag.frame)cancelAnimationFrame(groupPointDrag.frame);groupPointDrag.ghost?.remove();groupPointDrag=null;clearGroupDropTarget()});
document.addEventListener('dragstart',event=>{const chip=groupRuleFromEvent(event);if(chip&&event.dataTransfer){event.dataTransfer.setData('text/plain',chip.dataset.pointRule);event.dataTransfer.effectAllowed='copy'}});
document.addEventListener('dragover',event=>{const row=event.target instanceof Element?event.target.closest('[data-drop-target]'):null;if(!row)return;event.preventDefault();row.classList.add('drop-active');if(event.dataTransfer)event.dataTransfer.dropEffect='copy'});
document.addEventListener('dragleave',event=>{const row=event.target instanceof Element?event.target.closest('[data-drop-target]'):null;if(row&&!row.contains(event.relatedTarget))row.classList.remove('drop-active')});
document.addEventListener('drop',event=>{const row=event.target instanceof Element?event.target.closest('[data-drop-target]'):null;if(!row)return;event.preventDefault();row.classList.remove('drop-active');const ruleId=event.dataTransfer?.getData('text/plain');if(ruleId)submitGroupRule(row.dataset.dropTarget,ruleId)});

function avatarMarkup(source,name,extra=''){const letter=esc((name||'?').trim().slice(0,1).toLocaleUpperCase('vi'));return `<div class="avatar ${extra}">${source?`<img src="${esc(source)}" alt="Ảnh đại diện ${esc(name||'người dùng')}">`:letter}</div>`}

async function api(path,method='GET',body){const opt={method,credentials:'same-origin',headers:{}};if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}if(!['GET','HEAD'].includes(method)&&csrf)opt.headers['X-CSRF-Token']=csrf;const r=await fetch('/api'+path,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`Lỗi ${r.status}`);return d}
function exportCsv(filename,headers,rows){const cell=value=>{let text=String(value??'');if(/^[\s\u0000-\u001f]*[=+\-@]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"'};const csv=[headers,...rows].map(row=>row.map(cell).join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}

function adminAcceptScreen(){const token=new URLSearchParams(location.search).get('token')||'';app.innerHTML=`<main class="card auth"><div class="brand"><i>CT</i>ClassTrack</div><h1>Chấp nhận lời mời quản trị</h1><p class="muted">Lời mời có hiệu lực trong 48 giờ và chỉ dùng một lần.</p><form id="adminAccept"><div class="field"><label>Email nhận lời mời</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Tên \u0111ăng nhập</label><input name="username" required minlength="3" pattern="[A-Za-z0-9._-]+" autocomplete="username"></div><div class="field"><label>Tên hiển thị</label><input name="displayName" required maxlength="80"></div><div class="field"><label>Mật khẩu (at least 10 characters)</label><input name="password" type="password" required minlength="10" autocomplete="new-password"></div><button class="btn primary">Tạo tài khoản quản trị</button></form><p id="err" class="danger"></p></main>`;document.querySelector('#adminAccept').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.currentTarget));body.token=token;try{const r=await api('/admin/invitations/accept','POST',body);csrf=r.csrfToken;me=null;history.replaceState({},'', '/');await boot()}catch(x){document.querySelector('#err').textContent=x.message}}}

function parseSeparatedRoster(text){const first=String(text||'').split(/\r?\n/,1)[0]||'',delimiter=first.includes('\t')?'\t':',';const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===delimiter){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));rows.push(row);while(rows.length&&rows[rows.length-1].every(x=>!String(x).trim()))rows.pop();return rows}
function rosterHeaderInfo(rows){if(!rows.length)return null;const keys=rows[0].map(rosterHeaderKey),map={};for(const [field,aliases] of Object.entries(rosterHeaders)){const i=keys.findIndex(k=>aliases.includes(k));if(i>=0)map[field]=i}return Object.keys(map).length>=1?map:null}

function toIsoDate(value){const s=String(value||'').trim();if(!s)return '';let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m){const d=s.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{4})$/);if(!d)throw Error('Ngày không hợp lệ. Hãy nhập theo dạng ngày/tháng/năm, ví dụ 31/01/2010.');m=[null,d[3],d[2],d[1]]}const iso=m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'),date=new Date(iso+'T00:00:00Z');if(Number.isNaN(date.valueOf())||date.toISOString().slice(0,10)!==iso)throw Error('Ngày không tồn tại. Hãy kiểm tra ngày, tháng và năm.');return iso}

function normalizedRosterDate(value){const s=String(value||'').trim();if(!s)return '';let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m){const parts=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);if(!parts)return s;m=[null,parts[3],parts[2],parts[1]]}const iso=m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'),d=new Date(iso+'T00:00:00Z');return !Number.isNaN(d.valueOf())&&d.toISOString().slice(0,10)===iso?iso:s}

async function importRoster(e){const file=e.target.files[0];e.target.value='';if(!file)return;try{let rows;if(file.name.toLowerCase().endsWith('.csv'))rows=parseCSV(await file.text());else{if(!window.XLSX)await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.append(s)});const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false})}const norm=x=>String(x||'').toLowerCase().replace(/[ _-]/g,'');const data=rows.map(r=>({studentCode:r.studentCode||r.code||r['Mã học sinh']||r['Ma hoc sinh']||r['Mã HS']||'',fullName:r.fullName||r.name||r['Họ và tên']||r['Họ tên']||r['Ho va ten']||'',dateOfBirth:r.dateOfBirth||r['Ngày sinh']||'',group:r.group||r['Nhóm']||''})).filter(x=>x.studentCode||x.fullName);if(!data.length)throw Error('Không tìm thấy dữ liệu. Cột cần có: studentCode, fullName, dateOfBirth, group.');let classId=selectedClass;if(!classId)throw Error('Chọn lớp trước khi import.');let preview=await api(`/classes/${classId}/students/import/preview`,'POST',{rows:data});modal(`<h2>Xem trước nhập học sinh</h2><p>Tổng ${preview.totalRows} · Hợp lệ <b>${preview.validCount}</b> · Lỗi/trùng <b class="danger">${preview.errorCount}</b></p>${preview.errors.length?`<div class="roster-errors" role="alert"><b>Dòng bị trùng hoặc không hợp lệ</b>${preview.errors.map(x=>`<div><b>Dòng ${x.row}</b>: ${esc(x.errors.join(', '))}</div>`).join('')}</div>`:''}<div class="tablewrap" style="max-height:240px"><table><tr><th>Mã HS</th><th>Họ tên</th><th>Tổ</th></tr>${preview.preview.map(x=>`<tr><td>${esc(x.studentCode)}</td><td class="student-full-name">${esc(x.fullName)}</td><td>${esc(x.group)}</td></tr>`).join('')}</table></div><p class="hint">Mã kích hoạt sẽ chỉ được trả về một lần sau khi xác nhận. Hãy lưu an toàn.</p><div class="row"><button class="btn primary" id="confirmImport" ${preview.validCount?'':'disabled'}>Xác nhận tạo ${preview.validCount} tài khoản</button><button class="btn cancel-btn" id="cancelImport" data-preview-id="${preview.previewId}">Hủy nhập</button></div>`);document.querySelector('#confirmImport').onclick=async()=>{try{const r=await api(`/imports/${preview.previewId}/confirm`,'POST',{});modal(`<h2>Đã tạo ${r.createdCount} tài khoản</h2><p>Danh sách mã kích hoạt chỉ hiển thị lần này. Tải xuống/lưu tệp riêng tư ngay.</p><div class="tablewrap"><table><tr><th>Mã HS</th><th>Tên \u0111ăng nhập</th><th>Activation code</th></tr>${r.activationCodes.map(x=>`<tr><td>${esc(x.studentCode)}</td><td>${esc(x.username)}</td><td class="code">${esc(x.activationCode)}</td></tr>`).join('')}</table></div><button class="btn primary" id="downloadCodes">T&#7843;i danh s&#225;ch Excel</button> <button class="btn" onclick="closeModal()">Đóng</button>`);document.querySelector('#downloadCodes').onclick=()=>downloadStudentExcel(r.activationCodes);await boot()}catch(x){toast(x.message)}}}catch(x){toast(x.message||'Không đọc được tệp.')} }
function parseCSV(text){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);out.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}row.push(cell);if(row.some(x=>x.trim()))out.push(row);if(!out.length)return[];const headers=out.shift().map(x=>x.trim().toLowerCase());const alias={studentcode:['studentcode','code','mã học sinh','ma hoc sinh','mã hs'],fullname:['fullname','name','họ và tên','họ tên','ho va ten'],dateofbirth:['dateofbirth','ngày sinh','ngay sinh'],group:['group','tổ','nhóm']};return out.map(r=>{let o={};for(const[k,alts]of Object.entries(alias)){let n=headers.findIndex(h=>alts.includes(h));o[k]=n<0?'':r[n]||''}return o})}
async function downloadStudentExcel(rows){const entries=rows||[];if(!window.XLSX){try{await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';script.onload=resolve;script.onerror=reject;document.head.append(script)})}catch{}}if(window.XLSX){const data=[['H\u1ecd v\u00e0 t\u00ean','M\u00e3 h\u1ecdc sinh','T\u00ean \u0111\u0103ng nh\u1eadp','M\u00e3 k\u00edch ho\u1ea1t'],...entries.map(x=>[x.fullName||'',x.studentCode||'',x.username||'',x.activationCode||''])];const sheet=XLSX.utils.aoa_to_sheet(data),book=XLSX.utils.book_new();XLSX.utils.book_append_sheet(book,sheet,'Danh sach hoc sinh');XLSX.writeFile(book,'danh-sach-hoc-sinh.xlsx');return}const safe=v=>{const text=String(v??'');return /^[\s]*[=+@]/.test(text)?"'"+text:text};const body=entries.map(x=>'<tr><td>'+esc(safe(x.fullName||''))+'</td><td>'+esc(safe(x.studentCode||''))+'</td><td>'+esc(safe(x.username||''))+'</td><td>'+esc(safe(x.activationCode||''))+'</td></tr>').join('');const html='<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><table><thead><tr><th>H&#7885; v&#224; t&#234;n</th><th>M&#227; h&#7885;c sinh</th><th>T&#234;n &#273;&#259;ng nh&#7853;p</th><th>M&#227; k&#237;ch ho&#7841;t</th></tr></thead><tbody>'+body+'</tbody></table></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',html],{type:'application/vnd.ms-excel;charset=utf-8'}));a.download='danh-sach-hoc-sinh.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadCSV(rows){const csv='studentCode,username,activationCode\r\n'+rows.map(x=>[x.studentCode,x.username,x.activationCode].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='ma-kich-hoat-hoc-sinh.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function boot(){try{const status=await api('/status');if(location.pathname==='/admin/accept'){adminAcceptScreen();return}if(!me){try{me=await api('/me');csrf=me.csrfToken}catch{if(location.pathname==='/activate'){activateScreen();return}if(location.pathname==='/admin/accept'){adminAcceptScreen();return}authScreen(status.bootstrapRequired);return}}years=await api('/years').catch(()=>[]);classes=await api(`/classes${selectedYear?'?yearId='+encodeURIComponent(selectedYear):''}`).catch(()=>[]);if(!selectedClass||!classes.some(c=>c.id===selectedClass))selectedClass=classes[0]?.id||'';await render()}catch(e){app.innerHTML=`<main class="card auth"><h1>Không kết nối được ClassTrack</h1><p>${esc(e.message)}</p><p>Chạy máy chủ bằng <code>python server.py</code>, sau đó mở <code>http://127.0.0.1:8000</code>.</p></main>`}}
boot();
